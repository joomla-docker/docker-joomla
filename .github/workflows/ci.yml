name: GitHub CI

on:
  pull_request:
  push:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  generate-jobs:
    name: Generate build contexts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install generator dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq
      - name: Resolve versions and generate contexts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./generate.sh
      - name: Verify generation and publication metadata
        id: generate
        env:
          STACKBREW_GIT_REPO: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          jq -c -f src/build/lib/tags.jq conf/versions.json > "$RUNNER_TEMP/contexts.json"
          mapfile -t contexts < <(jq -r '.[].directory' "$RUNNER_TEMP/contexts.json")
          find "${contexts[@]}" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/before.sha256"
          ./src/build/build.sh
          find "${contexts[@]}" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/after.sha256"
          cmp "$RUNNER_TEMP/before.sha256" "$RUNNER_TEMP/after.sha256"
          status=$(git status --porcelain -- conf/versions.json "${contexts[@]}")
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo '::error::Run ./generate.sh and commit the active generated contexts and conf/versions.json.'
            exit 1
          fi
          ./release.sh > "$RUNNER_TEMP/joomla-library"
          [[ "$(grep -c '^Builder:' "$RUNNER_TEMP/joomla-library")" == 1 ]]
          grep -qx 'Builder: buildkit' "$RUNNER_TEMP/joomla-library"
          awk '$1 == "GitCommit:" { commit = $2 } $1 == "Directory:" { print $2 "\t" commit }' \
            "$RUNNER_TEMP/joomla-library" > "$RUNNER_TEMP/context-pins.tsv"
          while IFS=$'\t' read -r directory commit; do
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
            [[ "$(git rev-parse "$commit:$directory")" == "$(git rev-parse "HEAD:$directory")" ]]
          done < "$RUNNER_TEMP/context-pins.tsv"
          pins=$(jq -Rn '[inputs | split("\t") | {key: .[0], value: .[1]}] | from_entries' \
            < "$RUNNER_TEMP/context-pins.tsv")
          jq -e --argjson pins "$pins" \
            'length == ($pins | length) and all(.[]; $pins[.directory] != null)' \
            "$RUNNER_TEMP/contexts.json" > /dev/null
          matrix=$(jq -c --argjson pins "$pins" \
            '{include: map({directory, commit: $pins[.directory], variant, development, latest: (.tags | index("latest") != null), image: ("joomla:" + .tags[0])})}' \
            "$RUNNER_TEMP/contexts.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-manifest
          path: ${{ runner.temp }}/joomla-library
          if-no-files-found: error
          retention-days: 3

  test:
    needs: generate-jobs
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-jobs.outputs.matrix) }}
    name: ${{ matrix.directory }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare runtime tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfcgi-bin
          git clone --depth 1 https://github.com/docker-library/official-images.git "$RUNNER_TEMP/official-images"
      - name: Build the committed publication context
        env:
          IMAGE: ${{ matrix.image }}
          CONTEXT: ${{ matrix.directory }}
          COMMIT: ${{ matrix.commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/build-context"
          git archive "$COMMIT:$CONTEXT" | tar -x -C "$RUNNER_TEMP/build-context"
          docker buildx build --load --pull --progress=plain --tag "$IMAGE" "$RUNNER_TEMP/build-context"
      - name: Official Images tests
        env:
          IMAGE: ${{ matrix.image }}
        run: '"$RUNNER_TEMP/official-images/test/run.sh" "$IMAGE"'
      - name: Joomla runtime and development tests
        env:
          IMAGE: ${{ matrix.image }}
          VARIANT: ${{ matrix.variant }}
          DEVELOPMENT: ${{ matrix.development }}
        run: ./tests/test-images.sh "$IMAGE" "$VARIANT" "$DEVELOPMENT"
      - name: Install and serve latest Joomla
        if: matrix.latest
        timeout-minutes: 10
        env:
          IMAGE: ${{ matrix.image }}
          VARIANT: ${{ matrix.variant }}
        run: |
          ./tests/test-joomla.sh "$IMAGE" "$VARIANT" false
          ./tests/test-joomla.sh "$IMAGE" "$VARIANT" true
      - name: Image history
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
        run: docker history "$IMAGE"
